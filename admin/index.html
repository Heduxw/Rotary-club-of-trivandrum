<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../media/Rotarty logo title.svg"
        />
        <link rel="stylesheet" href="admin.css" />
    </head>
    <body>
        <div id="navbar-root"></div>
        <div class="admin-login" id="login-view">
            <h2>Admin Login</h2>
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Password" />
            <button id="login-btn">Log In</button>
            <p class="error" id="login-error"></p>
        </div>

        <!-- ─── DASHBOARD VIEW ─── -->
        <div class="admin-dash" id="dash-view" style="display: none">
            <div class="admin-layout">
                <!-- LEFT: tabbed form -->
                <div class="admin-card form-card">
                    <div class="tabs">
                        <button class="tab active" data-tab="article">
                            Article
                        </button>
                        <button class="tab" data-tab="history">History</button>
                        <button class="tab" data-tab="gallery">Gallery</button>
                        <button class="tab" data-tab="members">Members</button>
                    </div>

                    <input type="text" id="f-title" placeholder="Title" />
                    <input type="date" id="f-date" style="display: none" />
                    <select id="f-year">
                        <option value="">Select Rotary year</option>
                    </select>
                    <textarea
                        id="f-body"
                        placeholder="Article text"
                        rows="7"
                    ></textarea>
                    <input type="file" id="f-image" accept="image/*" />
                    <button class="publish-btn" id="publish-btn">
                        Publish Article
                    </button>
                    <p class="form-msg" id="form-msg"></p>
                </div>

                <!-- RIGHT: two list cards -->
                <div class="admin-lists">
                    <div class="admin-card list-card">
                        <h3 class="list-title">Article</h3>
                        <div id="article-list"></div>
                    </div>

                    <div class="admin-card list-card">
                        <h3 class="list-title">History</h3>
                        <div id="history-list"></div>
                    </div>

                    <div class="admin-card list-card">
                        <h3 class="list-title">Gallery</h3>
                        <div id="gallery-list"></div>
                    </div>

                    <div class="admin-card list-card">
                        <h3 class="list-title">Members</h3>
                        <div id="members-list"></div>
                    </div>
                </div>
            </div>

            <button id="logout-btn" class="logout-btn">Log Out</button>
        </div>

        <!-- Scripts: library → config → admin logic -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../scripts/supabase-config.js"></script>
        <script src="../scripts/utils.js"></script>
        <script src="admin.js"></script>
        <script src="../scripts/navbar.js"></script>
    </body>
</html>
