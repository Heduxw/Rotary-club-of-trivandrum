<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Our Projects</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../media/Rotarty logo title.svg"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://egdbbovmwpexdkwkuuts.supabase.co" />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/style-secondary.css" />
    </head>
    <body>
        <div id="navbar-root"></div>
        <section class="articles-section">
            <div class="container">
                <div class="articles-toolbar">
                    <h1 class="articles-heading">News & Projects</h1>
                    <label class="year-filter">
                        Rotary year:
                        <select id="year-filter">
                            <option value="all">All years</option>
                        </select>
                    </label>
                </div>
                <div class="articles-grid" id="articles-grid">
                    <p class="loading">Loading articles...</p>
                </div>
            </div>
        </section>

        <!-- Supabase library, then your config, then page script -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../scripts/supabase-config.js"></script>
        <script src="../scripts/utils.js"></script>
        <script src="../scripts/articles.js"></script>
        <script src="../scripts/navbar.js"></script>
        <script src="../scripts/footer.js"></script>
    </body>
</html>
