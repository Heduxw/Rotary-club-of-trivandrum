<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Project</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../media/Rotarty logo title.svg"
        />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/article.css" />
    </head>
    <body>
        <div id="navbar-root"></div>
        <article class="single-article container" id="article">
            <p class="loading">Loading...</p>
        </article>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../scripts/supabase-config.js"></script>
        <script src="../scripts/utils.js"></script>
        <script>
            async function loadArticle() {
                const id = new URLSearchParams(location.search).get("id");
                const el = document.getElementById("article");

                const { data, error } = await supabaseClient
                    .from("articles")
                    .select("*")
                    .eq("id", id)
                    .single();

                if (error || !data) {
                    el.innerHTML = `<p class="error">Article not found.</p>`;
                    return;
                }

                const safeTitle = escapeHtml(data.title);
                const safeBody = escapeHtml(data.body).replace(/\n/g, "<br>");
                const safeYear = escapeHtml(data.rotary_year);

                el.innerHTML = `
        ${data.image_url ? `<img src="${escapeAttr(data.image_url)}" class="single-img" alt="">` : ""}
        <h1>${safeTitle}</h1>
        ${safeYear ? `<p class="rotary-year">Rotary Year ${safeYear}</p>` : ""}
        <p class="single-body">${safeBody}</p>
        <a href="../articles/" class="back-link">← Back to all articles</a>
      `;
            }
            loadArticle();
        </script>
        <script src="../scripts/navbar.js"></script>
        <script src="../scripts/footer.js"></script>
    </body>
</html>
