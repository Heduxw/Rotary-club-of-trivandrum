<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://egdbbovmwpexdkwkuuts.supabase.co" />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/style-secondary.css" />
        <title>Gallery | Rotary Club of Trivandrum</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../media/Rotarty logo title.svg"
        />
    </head>
    <body>
        <div id="navbar-root"></div>

        <section class="gallery-section">
            <div class="container">
                <h1 class="gallery-heading">Gallery</h1>
                <p class="gallery-subheading">
                    Moments from our projects, events and community work.
                </p>
                <div class="gallery-albums" id="gallery-grid">
                    <p class="loading">Loading gallery...</p>
                </div>
            </div>
        </section>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <span class="lightbox-close" id="lightbox-close">&times;</span>
            <img class="lightbox-img" id="lightbox-img" src="" alt="" />
            <p class="lightbox-caption" id="lightbox-caption"></p>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../scripts/supabase-config.js"></script>
        <script src="../scripts/utils.js"></script>
        <script src="../scripts/gallery.js"></script>
        <script src="../scripts/navbar.js"></script>
        <script src="../scripts/footer.js"></script>
    </body>
</html>
