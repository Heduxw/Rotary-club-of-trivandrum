<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/style-secondary.css" />
        <title>Gallery | Rotary Club of Trivandrum</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../media/Rotarty logo title.svg"
        />
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <a href="../">
                    <img
                        src="../media/Rotary club of trivandrum.svg"
                        alt="Rotary Club of Trivandrum"
                    />
                </a>
            </div>

            <!-- Hamburger Button (mobile only) -->
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-menu" id="nav-menu">
                <li><a href="../">Home</a></li>

                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">About ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="../team">Our Team</a></li>
                        <li><a href="../history">History</a></li>
                    </ul>
                </li>

                <li><a href="../gallery/">Gallery</a></li>

                <li><a href="../articles/">Projects</a></li>

                <li><a href="../contact">Contact</a></li>
            </ul>
        </nav>

        <section class="gallery-section">
            <div class="container">
                <h1 class="gallery-heading">Gallery</h1>
                <p class="gallery-subheading">
                    Moments from our projects, events and community work.
                </p>
                <div class="gallery-albums" id="gallery-grid">
                    <p class="loading">Loading gallery...</p>
                </div>
            </div>
        </section>

        <!-- Lightbox -->
        <div class="lightbox" id="lightbox">
            <span class="lightbox-close" id="lightbox-close">&times;</span>
            <img class="lightbox-img" id="lightbox-img" src="" alt="" />
            <p class="lightbox-caption" id="lightbox-caption"></p>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../scripts/supabase-config.js"></script>
        <script src="../scripts/utils.js"></script>
        <script src="../scripts/gallery.js"></script>
        <script src="../scripts/script.js"></script>
    </body>
</html>
