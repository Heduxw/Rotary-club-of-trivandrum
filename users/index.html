<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Member Login | Rotary Club of Trivandrum</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../media/Rotarty logo title.svg"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://egdbbovmwpexdkwkuuts.supabase.co" />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap"
        />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/style-secondary.css" />
        <link rel="stylesheet" href="user.css" />
    </head>
    <body>
        <div id="navbar-root"></div>

        <!-- ─── LOGIN VIEW ─── -->
        <div class="user-login" id="login-view">
            <h2>Member Login</h2>
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />
            <button id="login-btn">Log In</button>
            <p class="error" id="login-error"></p>
        </div>

        <!-- ─── MEMBERS VIEW (after login) ─── -->
        <section class="articles-section" id="dash-view" style="display: none">
            <div class="container">
                <div class="articles-toolbar">
                    <h1 class="articles-heading">Members Area</h1>
                    <button id="logout-btn" class="logout-btn">Log Out</button>
                </div>
                <p class="resources-subheading">
                    Documents and files shared with members.
                </p>
                <div class="resource-list" id="resource-list">
                    <p class="loading">Loading files...</p>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../scripts/supabase-config.js"></script>
        <script src="../scripts/utils.js"></script>
        <script src="user.js"></script>
        <script src="../scripts/navbar.js"></script>
    </body>
</html>
