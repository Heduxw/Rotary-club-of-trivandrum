<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Member Login | Rotary Club of Trivandrum</title>
        <link
            rel="icon"
            type="image/svg+xml"
            href="../media/Rotarty logo title.svg"
        />
        <link rel="stylesheet" href="../css/base.css" />
        <link rel="stylesheet" href="../css/style-secondary.css" />
        <link rel="stylesheet" href="user.css" />
    </head>
    <body>
        <nav class="navbar">
            <div class="logo">
                <a href="../">
                    <img
                        src="../media/Rotary club of trivandrum.svg"
                        alt="Rotary Club of Trivandrum"
                    />
                </a>
            </div>

            <!-- Hamburger Button (mobile only) -->
            <button class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-menu" id="nav-menu">
                <li><a href="../">Home</a></li>

                <li class="dropdown">
                    <a href="#" class="dropdown-toggle">About ▾</a>
                    <ul class="dropdown-menu">
                        <li><a href="../team">Our Team</a></li>
                        <li><a href="../history">History</a></li>
                    </ul>
                </li>

                <li><a href="../gallery/">Gallery</a></li>

                <li><a href="../articles/">Projects</a></li>

                <li><a href="../contact">Contact</a></li>
            </ul>
        </nav>

        <!-- ─── LOGIN VIEW ─── -->
        <div class="user-login" id="login-view">
            <h2>Member Login</h2>
            <input type="text" id="username" placeholder="Username" />
            <input type="password" id="password" placeholder="Password" />
            <button id="login-btn">Log In</button>
            <p class="error" id="login-error"></p>
        </div>

        <!-- ─── MEMBERS VIEW (after login) ─── -->
        <section class="articles-section" id="dash-view" style="display: none">
            <div class="container">
                <div class="articles-toolbar">
                    <h1 class="articles-heading">Members Area</h1>
                    <button id="logout-btn" class="logout-btn">Log Out</button>
                </div>
                <p class="resources-subheading">
                    Documents and files shared with members.
                </p>
                <div class="resource-list" id="resource-list">
                    <p class="loading">Loading files...</p>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../scripts/supabase-config.js"></script>
        <script src="../scripts/utils.js"></script>
        <script src="../scripts/script.js"></script>
        <script src="user.js"></script>
        <script src="../scripts/navbar.js"></script>
    </body>
</html>
